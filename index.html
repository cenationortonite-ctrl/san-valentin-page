<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>San Valentín 💘</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>¿Quieres ser mi San Valentín? 💘</h1>
      <p>Prometo risas, mimos y un plan bonito ✨</p>

      <div class="btns" id="arena" aria-label="Zona de botones">
        <button id="yesBtn" type="button">Sí 💖</button>
        <button id="noBtn" type="button">No 🙈</button>
      </div>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div class="hint">Tip: intenta atrapar el “Sí”… 😏</div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
